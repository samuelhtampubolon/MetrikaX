<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      P10, offline is the default: no font, no script and no stylesheet is fetched from a network
      origin. The content security policy states that as a rule rather than as an intention.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'"
    />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <meta name="theme-color" content="#000080" />
    <!-- Nothing is sent to a third party, so there is nothing for a referrer to reveal. -->
    <meta name="referrer" content="no-referrer" />
    <title>MetriKa</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
