<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="MetriKa: Perangkat Analisis Kuantitatif Pemasaran">
  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#111111" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- The window: a raised bevel over a light face, drawn the way the widget kit draws it. -->
  <rect x="2" y="2" width="896" height="256" fill="#d4d0c8"/>
  <path d="M2 258 L2 2 L898 2" fill="none" stroke="#ffffff" stroke-width="2"/>
  <path d="M898 2 L898 258 L2 258" fill="none" stroke="#808080" stroke-width="2"/>
  <rect x="4" y="4" width="892" height="252" fill="none" stroke="#111111" stroke-width="1"/>

  <!-- Title bar -->
  <rect x="8" y="8" width="884" height="26" fill="#000080"/>
  <text x="16" y="27" font-family="Tahoma, Verdana, sans-serif" font-size="14" fill="#ffffff">MetriKa</text>
  <g fill="#d4d0c8" stroke="#111111" stroke-width="1">
    <rect x="822" y="12" width="18" height="18"/>
    <rect x="844" y="12" width="18" height="18"/>
    <rect x="866" y="12" width="18" height="18"/>
  </g>

  <!-- Wordmark -->
  <text x="34" y="122" font-family="Georgia, 'Times New Roman', serif" font-size="66" fill="#111111" letter-spacing="1">MetriKa</text>
  <text x="38" y="158" font-family="Tahoma, Verdana, sans-serif" font-size="17" fill="#111111">Perangkat Analisis Kuantitatif Pemasaran</text>
  <text x="38" y="196" font-family="'Courier New', monospace" font-size="15" fill="#111111">76 rumus  ·  161 variabel  ·  satu ruang kerja  ·  tanpa sambungan internet</text>

  <!-- A tornado plot, because that is what the tool draws -->
  <g transform="translate(600 62)">
    <line x1="108" y1="0" x2="108" y2="140" stroke="#111111" stroke-width="1"/>
    <g stroke="#111111" stroke-width="1" fill="url(#hatch)">
      <rect x="18" y="6" width="90" height="16"/>
      <rect x="108" y="30" width="78" height="16"/>
      <rect x="46" y="54" width="62" height="16"/>
      <rect x="108" y="78" width="44" height="16"/>
      <rect x="82" y="102" width="26" height="16"/>
    </g>
    <line x1="18" y1="146" x2="216" y2="146" stroke="#111111" stroke-width="1"/>
    <text x="108" y="164" font-family="Tahoma, Verdana, sans-serif" font-size="11" fill="#111111" text-anchor="middle">Ayunan hasil</text>
  </g>
</svg>
