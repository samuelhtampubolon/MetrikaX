name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: install, codegen, verify, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Nothing in the shipped bundle should carry a known advisory, and neither should the tools
      # that build it: a compromised build tool writes the artefact people download.
      - name: Audit dependencies
        run: pnpm audit --audit-level low

      - name: Codegen
        run: pnpm codegen

      # AC-17: no generated file differs from a fresh generation.
      - name: Verify generated sources are unchanged
        run: |
          pnpm verify
          if ! git diff --quiet; then
            echo "Generated files differ from a fresh generation. Run pnpm codegen and commit."
            git --no-pager diff --stat
            exit 1
          fi

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Build the web application
        run: pnpm build

      # AC-06, AC-08, AC-09 and AC-10, checked against the production build in a real browser.
      - name: Offline and security end to end suite
        run: |
          pnpm --filter @metrika/app exec playwright install --with-deps chromium
          pnpm --filter @metrika/app exec playwright test

  content-lint:
    name: content lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # AC-14 and the humility paradox test: the forbidden adjectives appear zero times.
      - name: Forbidden adjective check
        run: node scripts/content-lint.mjs

  desktop:
    name: desktop shell
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install the Linux webview dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf build-essential

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri

      # The web build has to exist before tauri-build reads frontendDist.
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm codegen && pnpm build

      # Cheap, and it catches the class of mistake that otherwise costs a full three-runner build.
      - name: Check tauri.conf.json against the CLI schema
        run: node scripts/check-tauri-config.mjs

      - name: Format, lint and test the shell
        working-directory: packages/desktop/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
