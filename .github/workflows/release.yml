name: Release

on:
  push:
    tags: ['v*']
  # Two uses. Left empty, this builds the desktop artefacts without releasing anything, which is
  # how a tag is verified before it is cut. Given a tag name, it publishes that release and
  # creates the tag at the head of this branch, which is the path to take when the tag cannot be
  # pushed directly.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish, for example v0.1.0. Leave empty to build without releasing.'
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # The tag this run publishes, from the pushed tag or from the dispatch input. Empty means build
  # only: tauri-action creates no release when it is given no tag name.
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.tag }}

jobs:
  desktop:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: ''
          - platform: ubuntu-22.04
            target: ''
          - platform: macos-latest
            target: ''

    steps:
      - uses: actions/checkout@v4

      - name: Install the Linux webview dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            build-essential \
            curl \
            wget \
            file

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # A universal macOS binary is linked from both architectures, so both have to be present.
          # Without this, tauri build --target universal-apple-darwin fails on the macOS runner.
          targets: ${{ matrix.platform == 'macos-latest' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri

      - run: pnpm install --frozen-lockfile

      # Before any Rust compiles: a bad configuration field should not cost three runners.
      - name: Check tauri.conf.json against the CLI schema
        run: node scripts/check-tauri-config.mjs

      - name: Codegen and verify
        run: |
          pnpm codegen
          pnpm verify

      - name: Test
        run: pnpm test

      - name: Build the web application
        run: pnpm build

      # The offline assertion, checked on the same artefact the desktop shell wraps.
      - name: Verify the build is offline and makes no outbound request
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          pnpm --filter @metrika/app exec playwright install --with-deps chromium
          pnpm --filter @metrika/app exec playwright test

      - name: Check the desktop shell
        working-directory: packages/desktop/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: packages/desktop
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: 'MetriKa ${{ env.RELEASE_TAG }}'
          releaseBody: |
            Unduh berkas yang sesuai dengan sistem Anda.

            `MetriKa-portable-windows-x64.exe` berjalan tanpa pemasangan dan tanpa hak
            administrator. Salin ke flash drive, lalu jalankan. Perangkat ini tidak melakukan
            permintaan jaringan apa pun, dan seluruh data tersimpan pada perangkat Anda.
          # Published rather than drafted. A draft release has no public download link, and a
          # download link that only the repository owner can see is not a download link. Every
          # gate has already run above this step on all three platforms, so there is nothing a
          # draft would be held back for.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false
          args: ${{ matrix.platform == 'macos-latest' && '--target universal-apple-darwin' || '' }}

      # desktop.portable_build: also emit the raw executable, under a plain name, so the portable
      # download is obvious rather than buried in a bundle directory.
      - name: Name the portable Windows executable
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          src="packages/desktop/src-tauri/target/release/metrika.exe"
          if [ ! -f "$src" ]; then
            echo "The release executable was not found at $src"
            ls -R packages/desktop/src-tauri/target/release | head -40
            exit 1
          fi
          mkdir -p portable
          cp "$src" "portable/MetriKa-portable-windows-x64.exe"
          ls -l portable

      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'windows-latest'
        with:
          name: MetriKa-portable-windows-x64
          path: portable/MetriKa-portable-windows-x64.exe
          if-no-files-found: error

      # tauri-action uploads the bundles it builds, which are the installers. The portable
      # executable is not one of them, so it is attached here. Without this step the release
      # carries an installer and no portable file, and the portable file is the one the
      # specification actually asks for.
      - name: Attach the portable executable to the release
        if: matrix.platform == 'windows-latest' && env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: portable/MetriKa-portable-windows-x64.exe
          fail_on_unmatched_files: true

      # AC-18 is a size budget, so the sizes are printed rather than left to be guessed at. They
      # go to the log as well as the job summary: a number only a human can see by opening a
      # summary page is a number nobody checks.
      - name: Record the measured size
        shell: bash
        run: |
          set -uo pipefail
          report() {
            echo "$1" | tee -a "$GITHUB_STEP_SUMMARY"
          }
          report "### Measured artefact sizes on ${{ matrix.platform }}"

          root=packages/desktop/src-tauri/target/release
          # wc -c rather than find -printf: the latter is GNU findutils and is not on macOS.
          find "$root" -type f \
            \( -name '*.exe' -o -name '*.AppImage' -o -name '*.dmg' -o -name '*.deb' -o -name '*.msi' \) \
            2>/dev/null | while read -r file; do
              bytes=$(wc -c < "$file" | tr -d ' ')
              report "$(awk -v b="$bytes" -v f="$file" 'BEGIN { printf "- %.2f MB  %s", b/1048576, f }')"
            done

          budget=31457280
          biggest=$(find "$root" -type f \( -name '*.exe' -o -name '*.msi' \) 2>/dev/null \
            | while read -r file; do wc -c < "$file"; done | sort -rn | head -1)
          if [ -n "${biggest:-}" ] && [ "$biggest" -gt "$budget" ]; then
            report "The largest Windows artefact is over the stated 30 MB budget."
            exit 1
          fi
